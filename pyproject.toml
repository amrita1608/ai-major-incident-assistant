[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "incident-ai-analyzer"
version = "0.1.0"
description = "AI-assisted analysis of major IT incidents using incident data, alerts, logs, and knowledge base articles."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Incident AI Analyzer Contributors"}
]

dependencies = [
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.20,<5.0",
    "requests>=2.31,<3.0",
    "click>=8.1,<9.0",
    "rich>=13.0,<15.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0"
]


[project.scripts]
incident-analyzer = "incident_analyzer.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"


[tool.coverage.run]
source = ["incident_analyzer"]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false
